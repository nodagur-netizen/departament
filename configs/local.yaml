app:
  name: "departamentMITM-APP"
  version: "0.1.0"
  env: "development"

db:
  local_path: "./.local/data/department.db"
  data_dir: "./.local/data"
  export_dir: "./.local/export"

logger:
  level: debug
  development: true
  disable_caller: true
  disable_stacktrace: true
  encoding: json
  output_paths: stderr
  error_output_paths: stderr

server:
  host: localhost
  port: 18180
  max_header_bytes: 1048576
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s
