<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оборудование — Кафедра</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .eq-page { max-width: 560px; margin: 40px auto; }
        .eq-card {
            background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
            padding: 28px 24px;
        }
        .eq-card h2 { font-size: 20px; margin: 0 0 4px }
        .eq-card .eq-id { color: #999; font-size: 13px; margin-bottom: 16px }
        .eq-card .eq-row { margin-bottom: 14px }
        .eq-card .eq-label { display: block; font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 2px }
        .eq-card .eq-value { font-size: 15px; word-break: break-word }
        .eq-card .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 13px }
        .badge-available { background: #dcfce7; color: #166534 }
        .badge-unavailable { background: #fef2f2; color: #991b1b }
        .qrcode { margin: 24px auto 12px; width: 180px; height: 180px; text-align: center }
        .qrcode img { width: 100%; height: 100% }
        .actions-bar { display: flex; gap: 8px; margin-top: 20px }
        .btn { padding: 8px 18px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block }
        .btn-primary { background: #007aff; color: #fff }
        .btn-secondary { background: #f0f0f0; color: #333 }
        .btn-primary:hover { background: #0056cc }
        .btn-secondary:hover { background: #ddd }
        .doc-link { color: #007aff }
    </style>
</head>
<body>
<div class="eq-page">
    <div class="eq-card" id="card">
        <h2 id="eq-name">—</h2>
        <div class="eq-id" id="eq-id"></div>
        <div id="eq-fields">Загрузка...</div>
        <div class="qrcode" id="qrcode"></div>
        <div style="font-size:12px;color:#aaa;text-align:center;margin-bottom:8px" id="qr-url"></div>
        <div class="actions-bar">
            <button class="btn btn-primary" onclick="window.print()">🖨️ Печать</button>
            <a href="/" class="btn btn-secondary">← Назад</a>
        </div>
    </div>
</div>

<script>
const id = window.location.pathname.split('/').pop();

async function load() {
    try {
        const r = await fetch('/api/v1/equipment/' + id);
        if (!r.ok) throw new Error('Not found');
        const e = await r.json();

        document.title = e.name + ' — Кафедра';
        document.getElementById('eq-name').textContent = e.name;
        document.getElementById('eq-id').textContent = '№' + e.id + (e.inventory_number ? ' · Инв. ' + e.inventory_number : '');

        // Ответственный
        let respName = '—';
        if (e.responsible_id) {
            try {
                const ur = await fetch('/api/v1/users/' + e.responsible_id);
                if (ur.ok) respName = (await ur.json()).full_name || e.responsible_id;
            } catch (_) {}
        }

        // Статус
        const badge = e.status
            ? '<span class="badge badge-available">Доступно</span>'
            : '<span class="badge badge-unavailable">Недоступно</span>';

        // Поверка
        let verif = 'не указана';
        if (e.verification_date) {
            const d = new Date(e.verification_date);
            const expired = d < new Date();
            verif = '<span style="' + (expired ? 'color:#dc2626;font-weight:bold' : 'color:#16a34a') + '">'
                + d.toLocaleDateString('ru-RU') + (expired ? ' (просрочена)' : '') + '</span>';
        }

        // Документация
        let doc = e.documentation || '—';
        if (e.documentation && (e.documentation.startsWith('http://') || e.documentation.startsWith('https://'))) {
            doc = '<a href="' + e.documentation + '" target="_blank" class="doc-link">Открыть документацию</a>';
        }

        document.getElementById('eq-fields').innerHTML = [
            ['Статус', badge],
            ['Описание', e.description || '—'],
            ['Расположение', e.location || '—'],
            ['Ответственный', respName],
            ['Поверка', verif],
            ['Документация', doc]
        ].map(([k, v]) => '<div class="eq-row"><span class="eq-label">' + k + '</span><span class="eq-value">' + v + '</span></div>').join('');

        // QR
        const url = window.location.href;
        document.getElementById('qr-url').textContent = url;
        const qrImg = document.createElement('img');
        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
        document.getElementById('qrcode').appendChild(qrImg);

    } catch(err) {
        document.getElementById('eq-name').textContent = 'Оборудование не найдено';
        document.getElementById('eq-fields').textContent = '';
    }
}

load();
</script>
</body>
</html>
